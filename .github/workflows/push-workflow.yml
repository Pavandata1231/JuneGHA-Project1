name: Push_Workflow
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 UTC
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Greeting
        run: echo "Hello World"
      - name: Print Goodbye
        run: |
          echo "This is  my first GHA"
          echo "workflow executed successfully"